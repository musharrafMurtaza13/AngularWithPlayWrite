name: Angular Unit & Playwright CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # 1. Unit Tests Run Honge
      - name: Run Unit Tests
        run: npx ng test --watch=false --browsers=ChromeHeadless

      # 2. Playwright Browsers Install Honge
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 3. Live Vercel Domain par E2E Tests Run Honge
      - name: Run Playwright tests on Vercel
        env:
          BASE_URL: 'https://angular-with-play-write-pysz.vercel.app'
        run: npx playwright test

      # 4. Report Upload (Agar test fail ho toh check karne ke liye)
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30