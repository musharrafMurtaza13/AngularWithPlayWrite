name: Angular Playwright CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Playwright Browsers Install Karein
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Live Vercel Domain par Direct E2E Tests Run Karein
      - name: Run Playwright Tests on Vercel
        env:
          BASE_URL: 'https://angular-with-play-write-pysz.vercel.app'
        run: npx playwright test

      # Test Artifacts / Report Upload
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30